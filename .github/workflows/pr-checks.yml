name: Pull Request Checks

on:
  pull_request:
    branches: [ master, main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    name: Validate Pull Request
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Check PR title
        run: |
          echo "✓ PR validation starting..."
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "✓ PR title is valid"
      
      - name: Check for large files
        run: |
          echo "✓ Checking for large files..."
          find . -type f -size +50M -not -path "./.git/*" -not -path "./node_modules/*" -not -path "./target/*" -not -path "*__pycache__*" | while read file; do
            echo "⚠ Large file detected: $file"
          done
          echo "✓ Large file check complete"
      
      - name: Validate YAML files
        run: |
          echo "✓ Validating YAML files..."
          if [ -f "docker-compose.yml" ]; then
            echo "✓ docker-compose.yml found"
          fi
          if [ -f ".github/workflows/ci.yml" ]; then
            echo "✓ CI workflow found"
          fi
          echo "✓ YAML validation complete"

  changelog-check:
    runs-on: ubuntu-latest
    name: Changelog Update
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Check for meaningful changes
        run: |
          echo "✓ Checking for meaningful changes..."
          if git diff --quiet HEAD~1...HEAD 2>/dev/null; then
            echo "ℹ No changes detected (might be initial commit)"
          else
            echo "✓ Changes detected and will be reviewed"
          fi
