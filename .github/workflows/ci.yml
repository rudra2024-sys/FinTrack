name: CI Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    name: Build Backend (Java/Maven)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Backend
        run: |
          cd fintrack-backend
          mvn clean install -DskipTests
      
      - name: Run Backend Tests
        run: |
          cd fintrack-backend
          mvn test

  frontend-build:
    runs-on: ubuntu-latest
    name: Build Frontend (Node.js)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true
      
      - name: Build Frontend
        run: npm run build --if-present
        continue-on-error: true

  ml-service-build:
    runs-on: ubuntu-latest
    name: Build ML Service (Python)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd fintrack-ml-service
          pip install -r requirements.txt
      
      - name: Run Syntax Check
        run: |
          cd fintrack-ml-service
          python -m py_compile app/main.py
          python -m py_compile app/pdf_parser.py
          python -m py_compile app/categorization.py

  docker-build:
    runs-on: ubuntu-latest
    name: Build Docker Images
    needs: [backend-build, frontend-build, ml-service-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./fintrack-backend
          push: false
          tags: fintrack-backend:latest
      
      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./fintrack-frontend
          push: false
          tags: fintrack-frontend:latest
      
      - name: Build ML Service Image
        uses: docker/build-push-action@v4
        with:
          context: ./fintrack-ml-service
          push: false
          tags: fintrack-ml-service:latest

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Check file structure
        run: |
          echo "✓ Checking project structure..."
          [ -d "fintrack-backend" ] && echo "✓ Backend directory found"
          [ -d "fintrack-frontend" ] && echo "✓ Frontend directory found"
          [ -d "fintrack-ml-service" ] && echo "✓ ML Service directory found"
          [ -f "docker-compose.yml" ] && echo "✓ Docker Compose file found"
          echo "✓ All required directories and files present"
