name: Dependency Check

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'fintrack-backend/pom.xml'
      - 'fintrack-frontend/package.json'
      - 'fintrack-ml-service/requirements.txt'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'fintrack-backend/pom.xml'
      - 'fintrack-frontend/package.json'
      - 'fintrack-ml-service/requirements.txt'
  workflow_dispatch:

jobs:
  check-backend-deps:
    runs-on: ubuntu-latest
    name: Check Backend Dependencies
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Verify Backend Dependencies
        run: |
          cd fintrack-backend
          mvn dependency:tree > /tmp/deps.txt
          echo "✓ Maven dependencies verified"
          echo "✓ Total dependencies can be viewed in build logs"

  check-frontend-deps:
    runs-on: ubuntu-latest
    name: Check Frontend Dependencies
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Verify Frontend Dependencies
        run: |
          npm ls --depth=0 2>/dev/null || echo "ℹ Running npm install..."
          npm install --dry-run
          echo "✓ npm dependencies verified"

  check-ml-deps:
    runs-on: ubuntu-latest
    name: Check ML Service Dependencies
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Verify ML Service Dependencies
        run: |
          cd fintrack-ml-service
          pip install -r requirements.txt --dry-run 2>&1 | tail -5
          echo "✓ Python dependencies verified"
